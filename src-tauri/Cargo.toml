[package]
name = "spaceforge"
version = "1.0.0"
description = "SpaceForge — disk-space intelligence, analysis, cleanup and duplicate detection"
authors = ["SpaceForge"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spaceforge-core = { path = "core" }
chrono = "0.4"
jwalk = "0.8"
crossbeam-channel = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The tauri crate target is the thin IPC/shell layer.
# All engines live in the spaceforge-core crate and are unit-tested there.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = [".", "core"]
resolver = "2"
