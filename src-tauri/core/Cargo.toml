[package]
name = "spaceforge-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "SpaceForge core engines: scanner, safety, cleaners, duplicates, snapshots, index"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
jwalk = "0.8"
rayon = "1.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
crossbeam-channel = "0.5"
globset = "0.4"
glob = "0.3"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Ioctl",
  "Win32_System_SystemInformation",
  "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3"
